apiVersion: apps/v1
kind: Deployment
metadata:
  name: document-service
  labels:
    app: document-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: document-service
  template:
    metadata:
      labels:
        app: document-service
    spec:
      initContainers:
        - name: document-migrate
          image: ${REGISTRY}/${IMAGE_NAME}:${IMAGE_TAG}
          securityContext:
            runAsUser: 0
          command:
            - sh
            - -c
            - "npx sequelize-cli db:migrate"
          env:
            - name: NODE_ENV
              value: "production"
            - name: DB_HOST
              valueFrom:
                secretKeyRef:
                  name: document-db
                  key: host
            - name: DB_PORT
              valueFrom:
                secretKeyRef:
                  name: document-db
                  key: port
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: document-db
                  key: user
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: document-db
                  key: password
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: document-db
                  key: name
      containers:
        - name: document-service
          image: ${REGISTRY}/${IMAGE_NAME}:${IMAGE_TAG}
          ports:
            - containerPort: 3003
          env:
            - name: NODE_ENV
              value: "production"
            - name: PORT
              value: "3003"
            - name: DB_HOST
              valueFrom:
                secretKeyRef:
                  name: document-db
                  key: host
            - name: DB_PORT
              valueFrom:
                secretKeyRef:
                  name: document-db
                  key: port
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: document-db
                  key: user
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: document-db
                  key: password
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: document-db
                  key: name
            - name: STORAGE_DRIVER
              value: "s3"
            - name: S3_ENDPOINT
              value: "http://minio:9000"
            - name: S3_PUBLIC_ENDPOINT
              value: "https://api.noahsolution.com"
            - name: S3_REGION
              value: "us-east-1"
            - name: S3_BUCKET
              value: "cmr-documents"
            - name: S3_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: minio-credentials
                  key: root-user
            - name: S3_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: minio-credentials
                  key: root-password
            - name: S3_FORCE_PATH_STYLE
              value: "true"
            - name: CORS_ORIGIN
              value: "https://crm.noahsolution.com"
            # Sin esto el OutboxRelay no arranca y los eventos de fichero se
            # quedan sin publicar. El secret lo crea el operador, igual que en
            # el resto de servicios (`<servicio>-rabbitmq` / key `url`).
            - name: RABBITMQ_URL
              valueFrom:
                secretKeyRef:
                  name: document-rabbitmq
                  key: url
            - name: OTEL_SERVICE_NAME
              value: "document-service"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://otel-collector.observability.svc.cluster.local:4318"
          volumeMounts:
            - name: storage
              mountPath: /data/uploads
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "300m"
          livenessProbe:
            httpGet:
              path: /health
              port: 3003
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health
              port: 3003
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: storage
          emptyDir: {}
          # Si tenés PVC funcional, reemplazá emptyDir por:
          # persistentVolumeClaim:
          #   claimName: document-storage-pvc
